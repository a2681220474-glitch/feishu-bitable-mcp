name: CI

on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * 1"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
        install-mode: [locked]
        include:
          - python-version: "3.12"
            install-mode: resolved
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            requirements-dev.lock
      - name: Install hash-locked dependencies and package
        if: matrix.install-mode == 'locked'
        run: |
          python -m pip install --require-hashes -r requirements-dev.lock
          python -m pip install --no-deps '.[dev]'
      - name: Resolve package and development dependencies
        if: matrix.install-mode == 'resolved'
        run: python -m pip install '.[dev]'
      - name: Check dependency consistency
        run: python -m pip check
      - name: Lint
        run: ruff check src tests examples
      - name: Run mock-based tests
        run: pytest
      - name: Build source and wheel distributions
        run: python -m build

  onboarding:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python -m pip install '.[dev]'
      - run: python -m pip check
      - name: Check packaged CLI and offline authorization boundaries
        run: python -m pytest tests/test_cli.py tests/test_doctor.py tests/test_auth.py tests/test_oauth.py tests/test_github_auth.py

  dependency-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install the audit tool
        run: python -m pip install pip-audit==2.10.1
      - name: Audit pinned dependencies against public advisories
        run: pip-audit --require-hashes -r requirements-dev.lock --progress-spinner off
